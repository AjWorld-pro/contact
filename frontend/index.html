<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactPro - Address Book Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <nav id="navbar" class="navbar hidden">
            <div class="nav-brand">
                <i class="fas fa-address-card"></i>
                <span>ContactPro</span>
            </div>
            <div class="nav-links" id="navLinks">
                <button class="nav-btn" data-page="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>
                <button class="nav-btn" data-page="contacts"><i class="fas fa-users"></i> Contacts</button>
                <button class="nav-btn" data-page="categories"><i class="fas fa-tags"></i> Categories</button>
                <button class="nav-btn" data-page="trash"><i class="fas fa-trash"></i> Trash</button>
                <button class="nav-btn admin-only hidden" data-page="admin"><i class="fas fa-shield-alt"></i> Admin</button>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-menu">
                    <button class="user-menu-btn" id="userMenuBtn">
                        <img id="navAvatar" src="" alt="" class="nav-avatar">
                        <span id="navUserName">User</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <button data-page="profile"><i class="fas fa-user"></i> Profile</button>
                        <button data-page="settings"><i class="fas fa-cog"></i> Settings</button>
                        <hr>
                        <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            </div>
        </nav>
        <main id="main-content">
            <div id="page-loader" class="page-loader hidden">
                <div class="spinner"></div>
            </div>
            <div id="page-content"></div>
        </main>
    </div>
    <div id="toast-container"></div>
    <div id="modal-container"></div>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/contacts.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
